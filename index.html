<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- URL を知っていれば誰でも見られる。検索エンジンには載せない（防御にはならない。4.7） -->
  <meta name="robots" content="noindex, nofollow">
  <title>キー帳</title>
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- ホーム画面に追加できるようにする（4.14） -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F2B134">
  <!-- 読み込み先の v= の値は、ビルドで内容のハッシュに置き換わる（4.14） -->
  <link rel="stylesheet" href="style.css?v=a5a869de65">
  <script type="module" src="app.js?v=a5a869de65"></script>
</head>
<body>
  <!-- 声の選択と調整（4.3.1）。一度合わせれば足りるので、スクロールすると隠れる場所に置く -->
  <section id="voice" class="voice" aria-label="声の選択と調整" hidden>
    <div class="voice-row">
      <span class="voice-label">声</span>
      <div id="voice-buttons" class="voice-buttons" role="group" aria-label="声を選ぶ"></div>
    </div>
    <div id="voice-adjust" class="voice-row"></div>
  </section>

  <header class="controls">
    <div class="search-row">
      <div class="search-box">
        <input type="search" id="search" placeholder="曲名・アーティストで検索" aria-label="曲名・アーティストで検索" autocomplete="off">
        <button type="button" id="search-clear" class="search-clear" aria-label="検索語を消す" hidden>×</button>
      </div>
      <!-- 絞り込みと並び替えを隠す・表示（Issue #15）。隠しているときは、かかっている絞り込みの数を丸で出す -->
      <button type="button" id="controls-toggle" class="controls-toggle" aria-controls="controls-more" aria-expanded="true" aria-label="絞り込みと並び替えを隠す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg>
        <span id="controls-badge" class="controls-badge" aria-hidden="true" hidden></span>
      </button>
    </div>
    <div id="controls-more" class="controls-more">
    <!-- 絞り込みは上から性別・ラベル・アーティストの順に1行ずつ（4.16） -->
    <div id="genders" class="filters" role="group" aria-label="性別で絞り込み"></div>
    <div id="labels" class="filters" role="group" aria-label="ラベルで絞り込み"></div>
    <!-- アーティストの絞り込み：ボタンで一覧のシートを開き、選んだアーティストは横に並べる（4.16） -->
    <div id="artists" class="filters" role="group" aria-label="アーティストで絞り込み"></div>
    <!-- 並び替え：絞り込みと見分けられるよう、見出しを付けて枠のない文字のタブにする（4.16） -->
    <div class="sort-row">
      <span class="sort-heading" aria-hidden="true">⇅ 並び替え</span>
      <div id="sort" class="sort" role="group" aria-label="並び替え">
        <button type="button" data-sort="id">登録順</button>
        <button type="button" data-sort="title">曲名</button>
        <button type="button" data-sort="artist">アーティスト名</button>
        <button type="button" data-sort="max_note">最高音</button>
      </div>
    </div>
    </div>
    <!-- 隠しているときは、曲数の後ろにかかっている絞り込みと並び順を出す -->
    <p class="count" role="status"><span id="count"></span><span id="count-summary" class="count-summary" hidden></span></p>
  </header>

  <main>
    <ul id="songs" class="songs"></ul>
  </main>

  <footer>
    <p id="updated"></p>
  </footer>

  <!-- 曲の詳細（4.16.1）。カードを押すと下から出る -->
  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <div id="detail-body" class="detail-body"></div>
  </dialog>

  <!-- アーティストの一覧（4.16）。曲の詳細と同じく下から出る -->
  <dialog id="artist-sheet" class="detail artist-sheet" aria-labelledby="artist-sheet-title">
    <div class="artist-sheet-head">
      <div class="grab"></div>
      <div class="artist-sheet-bar">
        <h2 id="artist-sheet-title">アーティストで絞り込み</h2>
        <button type="button" id="artist-clear" class="artist-clear">すべて解除</button>
        <!-- 開いたときに検索欄へフォーカスしない（スマホでキーボードが開くため） -->
        <button type="button" id="artist-close" class="detail-close" aria-label="閉じる" autofocus>×</button>
      </div>
      <div class="search-box">
        <input type="search" id="artist-search" placeholder="アーティストを検索" aria-label="アーティストを検索" autocomplete="off">
        <button type="button" id="artist-search-clear" class="search-clear" aria-label="検索語を消す" hidden>×</button>
      </div>
      <!-- シートの性別・ラベルは一覧だけを絞る（曲の一覧には効かない）。開くたびにホーム画面の選択から始める（Issue #14） -->
      <!-- 性別の行の右端に、条件（性別・ラベル・チェック・並び替え）を隠すボタン。隠しているときは同じ行に条件を短く出す（Issue #15） -->
      <div class="artist-cond-row">
        <div id="artist-genders" class="filters" role="group" aria-label="アーティストの一覧を性別で絞り込み"></div>
        <span id="artist-cond-summary" class="artist-cond-summary" hidden></span>
        <button type="button" id="artist-cond-toggle" class="artist-cond-toggle" aria-controls="artist-cond-more" aria-expanded="true">条件を隠す ▲</button>
      </div>
      <div id="artist-cond-more" class="artist-cond-more">
      <div id="artist-labels" class="filters" role="group" aria-label="アーティストの一覧をラベルで絞り込み"></div>
      <label class="artist-reflect">
        <input type="checkbox" id="artist-reflect">
        絞り込むときにラベル・性別も反映する
      </label>
      <div class="sort-row">
        <span class="sort-heading" aria-hidden="true">⇅ 並び替え</span>
        <div id="artist-sort" class="sort" role="group" aria-label="アーティストの並び替え"></div>
      </div>
      </div>
    </div>
    <ul id="artist-list" class="artist-list"></ul>
    <!-- シートの中の選択は下書き。「絞り込む」を押したときだけホーム画面に反映する（キャンセル・×・外側・Esc は反映しない） -->
    <div class="artist-sheet-foot">
      <!-- 選んでいるアーティスト：押すと外す。選んでいないときも行を残す（一覧が動かないように） -->
      <div id="artist-picked" class="filters artist-picked" role="group" aria-label="選んでいるアーティスト"></div>
      <div class="artist-actions">
        <button type="button" id="artist-cancel" class="artist-cancel">キャンセル</button>
        <button type="button" id="artist-apply" class="artist-apply">絞り込む<span id="artist-apply-count" class="artist-apply-count"></span></button>
      </div>
    </div>
  </dialog>
</body>
</html>
